name: C++ reference build + test

on:
  push:
    branches: [main]
    paths:
      - 'backends/cpp/**'
      - '.github/workflows/cpp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backends/cpp/**'
  workflow_dispatch:

jobs:
  build-test:
    name: C++ hand-rolled FFT build + tests
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          cmake --version
          g++ --version

      - name: Configure
        working-directory: backends/cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: backends/cpp
        run: cmake --build build --parallel

      # The physics testbeds drive the HTTP server: start it, wait for /health.
      - name: Start server
        working-directory: backends/cpp
        run: |
          ./build/kh-sim-cpp > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8003/health && exit 0; sleep 1; done
          cat server.log; exit 1

      - name: Run tests
        working-directory: backends/cpp
        run: ctest --test-dir build --output-on-failure

      - name: Build status summary
        if: always()
        run: |
          echo "======================================================="
          echo "C++ backend status"
          echo "  Compiler: $(g++ --version | head -1)"
          echo "  CMake:    $(cmake --version | head -1)"
          echo "  FFT:      hand-rolled iterative Cooley-Tukey (C1/C4 apply per doctrine)"
          echo "  Wave-1 anchor: golden-vector matrix at machine precision"
          echo "======================================================="
